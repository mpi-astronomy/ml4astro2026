[project]
name = "ml4astro2026"
authors = [
  {name = "Morgan Fouesneau", email = "fouesneau@mpia.de"},
]
description = "ML4Astro conference in Heidelberg"
readme = "README.md"
license = { file = 'LICENSE' }
classifiers = [
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    'Topic :: Scientific/Engineering :: Astronomy'
]
requires-python = ">=3.12"
dependencies = [
    "markdown",
    "pyyaml",
]
version = "2026.0"

[project.urls]
"Bug Tracker" = "https://github.com/mpi-astronomy/ml4astro2026/issues"
"Source Code" = "https://github.com/mpi-astronomy/ml4astro2026"

[build-system]
requires = [
    "setuptools>=60",
    "setuptools_scm>=8.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# By default, include-package-data is true in pyproject.toml, so you do
# NOT have to specify this line.
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["unittests"]       # exclude packages matching these glob patterns (empty by default)
namespaces = true             # to disable scanning PEP 420 namespaces (true by default)

[tool.ruff]
# Enumerate all fixed violations.
show-fixes = true
# Always generate Python 3.10-compatible code.
target-version = "py310"
# PEP-8 line length
line-length = 79
# Exclude a variety of commonly ignored directories.
exclude = [
    ".direnv",
    ".eggs",
    ".git",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pyenv",
    ".pytest_cache",
    ".ruff_cache",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    ".DS_Store",
    "_build",
    "build",
    "dist",
    "site-packages",
    "venv",
    ".pre-commit-config.yaml",
]

[tool.ruff.format]
# Enable reformatting of code snippets in docstrings.
docstring-code-format = true
# use double quotes for strings.
quote-style = "double"

[tool.ruff.lint]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "numpy"
